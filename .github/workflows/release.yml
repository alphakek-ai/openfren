name: Release

on:
  release:
    types: [published]

permissions:
  id-token: write  # Required for PyPI Trusted Publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build distributions
        run: uv build --no-sources

      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish
        # Do not set UV_PUBLISH_TOKEN; uv will use OIDC (Trusted Publishing)

      # Note: configure Trusted Publishing in your PyPI project settings to allow this workflow
      # to publish without credentials. See: https://docs.astral.sh/uv/guides/package/#publishing-your-package

